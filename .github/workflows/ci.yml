name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  DATABASE_URL: postgres://asnakech:asnakech@localhost:5432/asnakech?sslmode=disable

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: asnakech
          POSTGRES_PASSWORD: asnakech
          POSTGRES_DB: asnakech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asnakech -d asnakech"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build -o /dev/null ./cmd/api

      - name: OpenAPI check
        run: make docs-check

      - name: Migration up/down smoke
        run: |
          go run -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.2 \
            -path ./migrations -database "$DATABASE_URL" up
          go run -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.2 \
            -path ./migrations -database "$DATABASE_URL" down -all
          go run -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.2 \
            -path ./migrations -database "$DATABASE_URL" up
