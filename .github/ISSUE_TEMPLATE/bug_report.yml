name: Bug report
description: Report something that is broken or unexpected
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in as much as you can.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong in one or two sentences?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Numbered steps, including curl/commands if useful
      placeholder: |
        1. Run `make dev`
        2. `curl ...`
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: App version from `/health` or git SHA
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Go version, `ENV`, relevant config (no secrets)
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack traces
      render: shell
