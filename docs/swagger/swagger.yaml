basePath: /
definitions:
  handlers.AuthSuccessData:
    properties:
      tokens:
        $ref: '#/definitions/handlers.TokenPairResponse'
      user:
        $ref: '#/definitions/handlers.UserPublic'
      verification_token:
        type: string
    type: object
  handlers.AuthSuccessResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.AuthSuccessData'
      success:
        example: true
        type: boolean
    type: object
  handlers.AvatarIntentResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.AvatarUploadIntent'
      success:
        example: true
        type: boolean
    type: object
  handlers.AvatarUploadIntent:
    properties:
      method:
        example: PUT
        type: string
      note:
        type: string
      public_url:
        type: string
      upload_url:
        type: string
    type: object
  handlers.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/response.ErrorBody'
      meta:
        $ref: '#/definitions/response.Meta'
      success:
        example: false
        type: boolean
    type: object
  handlers.HealthData:
    properties:
      status:
        example: ok
        type: string
      version:
        example: 0.1.0
        type: string
    type: object
  handlers.HealthResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.HealthData'
      success:
        example: true
        type: boolean
    type: object
  handlers.MeResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.UserPublic'
      success:
        example: true
        type: boolean
    type: object
  handlers.MessageData:
    properties:
      message:
        type: string
      reset_token:
        type: string
    type: object
  handlers.MessageResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.MessageData'
      success:
        example: true
        type: boolean
    type: object
  handlers.ReadyData:
    properties:
      checks:
        items:
          $ref: '#/definitions/ready.Status'
        type: array
      status:
        example: ready
        type: string
      version:
        example: 0.1.0
        type: string
    type: object
  handlers.ReadyResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.ReadyData'
      success:
        example: true
        type: boolean
    type: object
  handlers.RoleResponse:
    properties:
      code:
        example: student
        type: string
      description:
        example: Learner enrolled in courses
        type: string
      id:
        example: a8b6d3f3-6b9b-42ee-98dc-9d8bf8ba2b0e
        type: string
      name:
        example: Student
        type: string
    type: object
  handlers.RolesListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.RoleResponse'
        type: array
      success:
        example: true
        type: boolean
    type: object
  handlers.TokenPairResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      refresh_token:
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  handlers.UserListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.UserPublic'
        type: array
      meta:
        $ref: '#/definitions/response.Meta'
      success:
        example: true
        type: boolean
    type: object
  handlers.UserPublic:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      full_name:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      locale:
        type: string
      phone:
        type: string
      role:
        type: string
      timezone:
        type: string
      updated_at:
        type: string
    type: object
  handlers.WelcomeData:
    properties:
      message:
        example: Welcome to Asnakech School API
        type: string
      version:
        example: 0.1.0
        type: string
    type: object
  handlers.WelcomeResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.WelcomeData'
      success:
        example: true
        type: boolean
    type: object
  handlers.adminUpdateUserRequest:
    properties:
      full_name:
        type: string
      is_active:
        type: boolean
      role:
        example: teacher
        type: string
    type: object
  handlers.forgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  handlers.loginRequest:
    properties:
      email:
        example: student@example.com
        type: string
      password:
        example: password123
        type: string
    required:
    - email
    - password
    type: object
  handlers.logoutRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handlers.refreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handlers.registerRequest:
    properties:
      email:
        example: student@example.com
        type: string
      full_name:
        example: Ada Student
        type: string
      password:
        example: password123
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  handlers.resetPasswordRequest:
    properties:
      new_password:
        minLength: 8
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  handlers.setAvatarRequest:
    properties:
      avatar_url:
        example: https://cdn.example.com/a.png
        type: string
    required:
    - avatar_url
    type: object
  handlers.updateProfileRequest:
    properties:
      bio:
        type: string
      full_name:
        type: string
      locale:
        type: string
      phone:
        type: string
      timezone:
        type: string
    type: object
  handlers.verifyEmailRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  ready.Status:
    properties:
      error:
        type: string
      name:
        type: string
      ok:
        type: boolean
      skipped:
        type: boolean
    type: object
  response.ErrorBody:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  response.Meta:
    properties:
      page:
        type: integer
      per_page:
        type: integer
      request_id:
        type: string
      total:
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: support@asnakech.com
    name: API Support
    url: http://www.asnakech.com/support
  description: |-
    Backend API for the Asnakech online education platform.
    All JSON responses use a shared envelope: `{ success, data, error, meta }`.
    Every response includes an `X-Request-ID` header.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://www.asnakech.com/terms
  title: Asnakech School API
  version: 0.1.0
paths:
  /api/v1/:
    get:
      description: Returns a short welcome payload for the v1 API root
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.WelcomeResponse'
      summary: API welcome
      tags:
      - system
  /api/v1/admin/users:
    get:
      description: Paginated user directory for administrators
      parameters:
      - default: 1
        description: Page
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: per_page
        type: integer
      - description: Filter by role code
        in: query
        name: role
        type: string
      - description: Search email or name
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.UserListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List users (admin)
      tags:
      - admin
  /api/v1/admin/users/{id}:
    delete:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Soft-delete user (admin)
      tags:
      - admin
    get:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user (admin)
      tags:
      - admin
    patch:
      consumes:
      - application/json
      description: Change role, active flag, or name
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Admin patch
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.adminUpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update user (admin)
      tags:
      - admin
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Request a password reset. Always returns a generic message. In
        development may include reset_token.
      parameters:
      - description: Forgot password payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.forgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Forgot password
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with email and password
      parameters:
      - description: Login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AuthSuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Login
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Revoke a refresh token
      parameters:
      - description: Logout payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.logoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Logout
      tags:
      - auth
  /api/v1/auth/me:
    get:
      description: Return the authenticated user profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Rotate refresh token and issue a new access token
      parameters:
      - description: Refresh payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AuthSuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Refresh tokens
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Create a student account and return access/refresh tokens. In development,
        may include verification_token.
      parameters:
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.AuthSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Register
      tags:
      - auth
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Set a new password using a reset token
      parameters:
      - description: Reset password payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.resetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Reset password
      tags:
      - auth
  /api/v1/auth/verify-email:
    post:
      consumes:
      - application/json
      description: Confirm email ownership with a verification token
      parameters:
      - description: Verify email payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.verifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Verify email
      tags:
      - auth
  /api/v1/roles:
    get:
      description: Returns seeded system roles (student, teacher, admin, parent).
        Requires DATABASE_URL and applied migrations.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.RolesListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: List platform roles
      tags:
      - roles
  /api/v1/users/me:
    get:
      description: Return the authenticated user's profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get my profile
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: Patch profile fields for the authenticated user
      parameters:
      - description: Profile fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.updateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update my profile
      tags:
      - users
  /api/v1/users/me/avatar:
    put:
      consumes:
      - application/json
      description: Temporary avatar hook until Stage 14 presigned uploads
      parameters:
      - description: Avatar URL
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.setAvatarRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Set my avatar URL
      tags:
      - users
  /api/v1/users/me/avatar/upload-intent:
    get:
      description: Placeholder for future presigned upload flow
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AvatarIntentResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Avatar upload intent
      tags:
      - users
  /health:
    get:
      description: Returns OK when the process is running. Not under /api/v1.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.HealthResponse'
      summary: Liveness probe
      tags:
      - health
  /ready:
    get:
      description: Returns OK when configured dependencies are reachable. Not under
        /api/v1.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ReadyResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Readiness probe
      tags:
      - health
securityDefinitions:
  BearerAuth:
    description: 'JWT access token. Format: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
