host: localhost:8080
info:
  contact:
    email: support@asnakech.com
    name: API Support
    url: http://www.asnakech.com/support
  description: |-
    Backend API for the Asnakech online education platform.
    All JSON responses use a shared envelope: `{ success, data, error, meta }`.
    Every response includes an `X-Request-ID` header.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://www.asnakech.com/terms
  title: Asnakech School API
  version: 0.1.0
paths:
  /api/v1/:
    get:
      description: Returns a short welcome payload for the v1 API root
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.WelcomeResponse'
      summary: API welcome
      tags:
      - system
  /api/v1/admin/users:
    get:
      description: Paginated user directory for administrators
      parameters:
      - default: 1
        description: Page
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: per_page
        type: integer
      - description: Filter by role code
        in: query
        name: role
        type: string
      - description: Search email or name
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.UserListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List users (admin)
      tags:
      - admin
  /api/v1/admin/users/{id}:
    delete:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Soft-delete user (admin)
      tags:
      - admin
    get:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user (admin)
      tags:
      - admin
    patch:
      consumes:
      - application/json
      description: Change role, active flag, or name
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Admin patch
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.adminUpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update user (admin)
      tags:
      - admin
  /api/v1/assignments/{assignmentId}:
    get:
      parameters:
      - description: Assignment ID
        in: path
        name: assignmentId
        required: true
