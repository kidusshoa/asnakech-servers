basePath: /
definitions:
  handlers.AuthSuccessData:
    properties:
      tokens:
        $ref: '#/definitions/handlers.TokenPairResponse'
      user:
        $ref: '#/definitions/handlers.UserPublic'
      verification_token:
        type: string
    type: object
  handlers.AuthSuccessResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.AuthSuccessData'
      success:
        example: true
        type: boolean
    type: object
  handlers.AvatarIntentResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.AvatarUploadIntent'
      success:
        example: true
        type: boolean
    type: object
  handlers.AvatarUploadIntent:
    properties:
      method:
        example: PUT
        type: string
      note:
        type: string
      public_url:
        type: string
      upload_url:
        type: string
    type: object
  handlers.CategoryEnvelope:
    properties:
      data:
        $ref: '#/definitions/handlers.CategoryResponse'
      success:
        example: true
        type: boolean
    type: object
  handlers.CategoryListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.CategoryResponse'
        type: array
      success:
        example: true
        type: boolean
    type: object
  handlers.CategoryResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      slug:
        type: string
    type: object
  handlers.CourseEnvelope:
    properties:
      data:
        $ref: '#/definitions/handlers.CourseResponse'
      success:
        example: true
        type: boolean
    type: object
  handlers.CourseListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.CourseResponse'
        type: array
      meta:
        $ref: '#/definitions/response.Meta'
      success:
        example: true
        type: boolean
    type: object
  handlers.CourseResponse:
    properties:
      category_id:
        type: string
      category_name:
        type: string
      cover_url:
        type: string
      created_at:
        type: string
      currency:
        type: string
      description:
        type: string
      id:
        type: string
      language:
        type: string
      level:
        type: string
      organization_id:
        type: string
      price_cents:
        type: integer
      published_at:
        type: string
      slug:
        type: string
      status:
        type: string
      summary:
        type: string
      tags:
        items:
          type: string
        type: array
      teacher_id:
        type: string
      teacher_name:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  handlers.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/response.ErrorBody'
      meta:
        $ref: '#/definitions/response.Meta'
      success:
        example: false
        type: boolean
    type: object
  handlers.HealthData:
    properties:
      status:
        example: ok
        type: string
      version:
        example: 0.1.0
        type: string
    type: object
  handlers.HealthResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.HealthData'
      success:
        example: true
        type: boolean
    type: object
  handlers.InviteEnvelope:
    properties:
      data:
        $ref: '#/definitions/handlers.InviteResponse'
      success:
        example: true
        type: boolean
    type: object
  handlers.InviteListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.InviteResponse'
        type: array
      success:
        example: true
        type: boolean
    type: object
  handlers.InviteResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      expires_at:
        type: string
      id:
        type: string
      org_role:
        type: string
      token:
        type: string
    type: object
  handlers.MeResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.UserPublic'
      success:
        example: true
        type: boolean
    type: object
  handlers.MemberListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.MemberResponse'
        type: array
      success:
        example: true
        type: boolean
    type: object
  handlers.MemberResponse:
    properties:
      email:
        type: string
      full_name:
        type: string
      joined_at:
        type: string
      org_role:
        type: string
      user_id:
        type: string
    type: object
  handlers.MessageData:
    properties:
      message:
        type: string
      reset_token:
        type: string
    type: object
  handlers.MessageResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.MessageData'
      success:
        example: true
        type: boolean
    type: object
  handlers.OrganizationEnvelope:
    properties:
      data:
        $ref: '#/definitions/handlers.OrganizationResponse'
      success:
        example: true
        type: boolean
    type: object
  handlers.OrganizationListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.OrganizationResponse'
        type: array
      success:
        example: true
        type: boolean
    type: object
  handlers.OrganizationResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      logo_url:
        type: string
      name:
        type: string
      slug:
        type: string
      updated_at:
        type: string
    type: object
  handlers.ReadyData:
    properties:
      checks:
        items:
          $ref: '#/definitions/ready.Status'
        type: array
      status:
        example: ready
        type: string
      version:
        example: 0.1.0
        type: string
    type: object
  handlers.ReadyResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.ReadyData'
      success:
        example: true
        type: boolean
    type: object
  handlers.RoleResponse:
    properties:
      code:
        example: student
        type: string
      description:
        example: Learner enrolled in courses
        type: string
      id:
        example: a8b6d3f3-6b9b-42ee-98dc-9d8bf8ba2b0e
        type: string
      name:
        example: Student
        type: string
    type: object
  handlers.RolesListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.RoleResponse'
        type: array
      success:
        example: true
        type: boolean
    type: object
  handlers.TokenPairResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      refresh_token:
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  handlers.UserListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.UserPublic'
        type: array
      meta:
        $ref: '#/definitions/response.Meta'
      success:
        example: true
        type: boolean
    type: object
  handlers.UserPublic:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      full_name:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      locale:
        type: string
      phone:
        type: string
      role:
        type: string
      timezone:
        type: string
      updated_at:
        type: string
    type: object
  handlers.WelcomeData:
    properties:
      message:
        example: Welcome to Asnakech School API
        type: string
      version:
        example: 0.1.0
        type: string
    type: object
  handlers.WelcomeResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.WelcomeData'
      success:
        example: true
        type: boolean
    type: object
  handlers.acceptInviteRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  handlers.adminUpdateUserRequest:
    properties:
      full_name:
        type: string
      is_active:
        type: boolean
      role:
        example: teacher
        type: string
    type: object
  handlers.createCategoryRequest:
    properties:
      description:
        type: string
      name:
        type: string
      slug:
        type: string
    required:
    - name
    type: object
  handlers.createCourseRequest:
    properties:
      category_id:
        type: string
      cover_url:
        type: string
      currency:
        example: ETB
        type: string
      description:
        type: string
      language:
        example: en
        type: string
      level:
        example: beginner
        type: string
      organization_id:
        type: string
      price_cents:
        type: integer
      slug:
        type: string
      summary:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    required:
    - title
    type: object
  handlers.createInviteRequest:
    properties:
      email:
        type: string
      role:
        example: member
        type: string
    required:
    - email
    type: object
  handlers.createOrgRequest:
    properties:
      description:
        type: string
      name:
        example: Asnakech Academy
        type: string
      slug:
        example: asnakech-academy
        type: string
    required:
    - name
    type: object
  handlers.forgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  handlers.loginRequest:
    properties:
      email:
        example: student@example.com
        type: string
      password:
        example: password123
        type: string
    required:
    - email
    - password
    type: object
  handlers.logoutRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handlers.refreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handlers.registerRequest:
    properties:
      email:
        example: student@example.com
        type: string
      full_name:
        example: Ada Student
        type: string
      password:
        example: password123
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  handlers.resetPasswordRequest:
    properties:
      new_password:
        minLength: 8
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  handlers.setAvatarRequest:
    properties:
      avatar_url:
        example: https://cdn.example.com/a.png
        type: string
    required:
    - avatar_url
    type: object
  handlers.setTagsRequest:
    properties:
      tags:
        items:
          type: string
        type: array
    required:
    - tags
    type: object
  handlers.updateCourseRequest:
    properties:
      category_id:
        type: string
      cover_url:
        type: string
      currency:
        type: string
      description:
        type: string
      language:
        type: string
      level:
        type: string
      price_cents:
        type: integer
      summary:
        type: string
      title:
        type: string
    type: object
  handlers.updateMemberRoleRequest:
    properties:
      role:
        example: admin
        type: string
    required:
    - role
    type: object
  handlers.updateOrgRequest:
    properties:
      description:
        type: string
      logo_url:
        type: string
      name:
        type: string
    type: object
  handlers.updateProfileRequest:
    properties:
      bio:
        type: string
      full_name:
        type: string
      locale:
        type: string
      phone:
        type: string
      timezone:
        type: string
    type: object
  handlers.verifyEmailRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  ready.Status:
    properties:
      error:
        type: string
      name:
        type: string
      ok:
        type: boolean
      skipped:
        type: boolean
    type: object
  response.ErrorBody:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  response.Meta:
    properties:
      page:
        type: integer
      per_page:
        type: integer
      request_id:
        type: string
      total:
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: support@asnakech.com
    name: API Support
    url: http://www.asnakech.com/support
  description: |-
    Backend API for the Asnakech online education platform.
    All JSON responses use a shared envelope: `{ success, data, error, meta }`.
    Every response includes an `X-Request-ID` header.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://www.asnakech.com/terms
  title: Asnakech School API
  version: 0.1.0
paths:
  /api/v1/:
    get:
      description: Returns a short welcome payload for the v1 API root
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.WelcomeResponse'
      summary: API welcome
      tags:
      - system
  /api/v1/admin/users:
    get:
      description: Paginated user directory for administrators
      parameters:
      - default: 1
        description: Page
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: per_page
        type: integer
      - description: Filter by role code
        in: query
        name: role
        type: string
      - description: Search email or name
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.UserListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List users (admin)
      tags:
      - admin
  /api/v1/admin/users/{id}:
    delete:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Soft-delete user (admin)
      tags:
      - admin
    get:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user (admin)
      tags:
      - admin
    patch:
      consumes:
      - application/json
      description: Change role, active flag, or name
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Admin patch
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.adminUpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update user (admin)
      tags:
      - admin
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Request a password reset. Always returns a generic message. In
        development may include reset_token.
      parameters:
      - description: Forgot password payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.forgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Forgot password
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with email and password
      parameters:
      - description: Login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AuthSuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Login
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Revoke a refresh token
      parameters:
      - description: Logout payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.logoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Logout
      tags:
      - auth
  /api/v1/auth/me:
    get:
      description: Return the authenticated user profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Rotate refresh token and issue a new access token
      parameters:
      - description: Refresh payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AuthSuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Refresh tokens
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Create a student account and return access/refresh tokens. In development,
        may include verification_token.
      parameters:
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.AuthSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Register
      tags:
      - auth
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Set a new password using a reset token
      parameters:
      - description: Reset password payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.resetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Reset password
      tags:
      - auth
  /api/v1/auth/verify-email:
    post:
      consumes:
      - application/json
      description: Confirm email ownership with a verification token
      parameters:
      - description: Verify email payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.verifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Verify email
      tags:
      - auth
  /api/v1/categories:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.CategoryListEnvelope'
      summary: List categories
      tags:
      - courses
    post:
      consumes:
      - application/json
      parameters:
      - description: Category
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.createCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.CategoryEnvelope'
      security:
      - BearerAuth: []
      summary: Create category
      tags:
      - courses
  /api/v1/courses:
    get:
      description: Public catalog defaults to published. Teachers/admins may see drafts
        they own (or all if admin).
      parameters:
      - description: Page
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: per_page
        type: integer
      - description: Search
        in: query
        name: q
        type: string
      - description: Category slug
        in: query
        name: category
        type: string
      - description: Tag slug
        in: query
        name: tag
        type: string
      - description: Organization ID
        in: query
        name: organization_id
        type: string
      - description: Teacher ID
        in: query
        name: teacher_id
        type: string
      - description: beginner|intermediate|advanced
        in: query
        name: level
        type: string
