info:
  contact:
    email: support@asnakech.com
    name: API Support
    url: http://www.asnakech.com/support
  description: |-
    Backend API for the Asnakech online education platform.
    All JSON responses use a shared envelope: `{ success, data, error, meta }`.
    Every response includes an `X-Request-ID` header.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://www.asnakech.com/terms
  title: Asnakech School API
  version: 0.1.0
paths:
  /api/v1/:
    get:
      description: Returns a short welcome payload for the v1 API root
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.WelcomeResponse'
      summary: API welcome
      tags:
      - system
  /api/v1/admin/overview:
    get:
      description: 'KPI snapshot: users, courses, enrollments, revenue, 7-day trends'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.PlatformOverviewEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Platform overview (admin)
      tags:
      - admin
  /api/v1/admin/reports/enrollments:
